<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skin Deep Daily</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout: a single focused column, with a skin cross-section that lights up the layer each question is about. */
:root{
  --bg:#fbf6f4; --surface:#ffffff; --ink:#2b1b2a; --muted:#6c5a68; --line:#e8d9d6;
  --accent:#8a2c62; --accent-ink:#ffffff; --accent-soft:#f6e3ee;
  --epi:#f2c6ac; --derm:#e59a9c; --sub:#f6dc8c; --vessel:#b53a4a; --gland:#fff3e6;
  --ok:#1d7a5f; --ok-soft:#e1f3ec; --bad:#b33a2b; --bad-soft:#fbe7e3; --tip:#fff6dc; --tip-line:#e7c35a;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1219; --surface:#271a24; --ink:#f6e9f0; --muted:#c2adbb; --line:#3d2b38;
  --accent:#f08bbd; --accent-ink:#2a0f1f; --accent-soft:#3b2132;
  --epi:#c98f74; --derm:#a95e68; --sub:#b89a4c; --vessel:#ff8a98; --gland:#3a2833;
  --ok:#6fd8b2; --ok-soft:#173329; --bad:#ff9a88; --bad-soft:#3d1e1a; --tip:#33291a; --tip-line:#c9a144;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1219; --surface:#271a24; --ink:#f6e9f0; --muted:#c2adbb; --line:#3d2b38;
  --accent:#f08bbd; --accent-ink:#2a0f1f; --accent-soft:#3b2132;
  --epi:#c98f74; --derm:#a95e68; --sub:#b89a4c; --vessel:#ff8a98; --gland:#3a2833;
  --ok:#6fd8b2; --ok-soft:#173329; --bad:#ff9a88; --bad-soft:#3d1e1a; --tip:#33291a; --tip-line:#c9a144;
  color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Masthead */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:2px solid var(--line);margin-bottom:24px}
.brand{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.brand h1{font-size:clamp(2rem,5vw,3rem);font-weight:800;letter-spacing:-.02em}
.brand h1 span{color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{display:flex;flex-direction:column;align-items:flex-start;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:92px}
.stat b{font-family:var(--font-display);font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat small{font-size:.75rem;color:var(--muted);letter-spacing:.04em}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:999px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;font-size:1rem}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{min-height:40px;padding:8px 16px;font-size:.92rem}
.btn.danger{border-color:var(--bad);background:var(--bad);color:var(--surface)}

/* Start screen */
.intro{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px;align-items:center}
.intro h2{font-size:clamp(1.6rem,3.6vw,2.3rem);font-weight:700}
.intro .lede{color:var(--muted);margin-top:10px;max-width:56ch}
.setmeta{margin-top:18px;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);letter-spacing:.02em}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}
.how{margin-top:26px;font-size:.9rem;color:var(--muted);display:grid;gap:4px}

/* Countdown */
.clock{display:inline-flex;gap:6px;align-items:baseline;font-variant-numeric:tabular-nums}
.clock b{font-family:var(--font-display);font-size:1.1rem}

/* Depth gauge */
.gauge{padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0 18px}
.gauge li{list-style:none;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:var(--ink);opacity:.45;border:2px solid transparent}
.gauge li:nth-child(1){background:var(--epi)}
.gauge li:nth-child(2){background:color-mix(in srgb,var(--epi) 50%,var(--derm))}
.gauge li:nth-child(3){background:var(--derm)}
.gauge li:nth-child(4){background:color-mix(in srgb,var(--derm) 50%,var(--sub))}
.gauge li:nth-child(5){background:var(--sub)}
.gauge li.cur{opacity:1;border-color:var(--ink)}
.gauge li.ok,.gauge li.bad{opacity:1}
.gauge li span{background:var(--surface);border-radius:999px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem}
.gauge li.ok span{color:var(--ok)} .gauge li.bad span{color:var(--bad)}
.gauge-wrap{margin:0}
.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;font-size:.9rem;color:var(--muted)}

/* Question */
.play{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.qtext{font-family:var(--font-display);font-weight:700;font-size:clamp(1.25rem,2.6vw,1.6rem);margin:8px 0 18px}
.opts{display:grid;gap:10px;margin:0;padding:0}
.opt{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;min-height:56px;transition:border-color .15s, transform .15s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateX(2px)}
.opt .key{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;background:var(--accent-soft);color:var(--accent);font-family:var(--font-display)}
.opt .mark{font-weight:700;font-size:.85rem}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .key{background:var(--ok);color:var(--surface)}
.opt.correct .mark{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:var(--surface)}
.opt.wrong .mark{color:var(--bad)}
.opt.dim{opacity:.6}
.feedback{margin-top:18px;border-radius:12px;padding:18px;display:grid;gap:12px}
.feedback.ok{background:var(--ok-soft);border:2px solid var(--ok)}
.feedback.bad{background:var(--bad-soft);border:2px solid var(--bad)}
.feedback h3{font-size:1.25rem}
.feedback.ok h3{color:var(--ok)} .feedback.bad h3{color:var(--bad)}
.tip{background:var(--tip);border-left:5px solid var(--tip-line);border-radius:8px;padding:12px 14px}
.tip strong{display:block;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.hint-keys{font-size:.8rem;color:var(--muted);margin-top:12px}

/* Diagram */
.diagram{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;position:sticky;top:calc(env(safe-area-inset-top, 0px) + 12px)}
.diagram figcaption{font-size:.85rem;color:var(--muted);margin-top:8px}
.diagram figcaption b{color:var(--ink)}
.diagram svg{display:block;width:100%;height:auto}
.diagram figure{margin:0}
svg .grp{transition:opacity .3s}
svg.focus .grp{opacity:.28}
svg.focus .grp.on{opacity:1}
svg .lbl{font-family:var(--font-body);font-size:11px;font-weight:700;fill:var(--ink)}
svg .lbl.small{font-size:9.5px;font-weight:400}

/* Results */
.result-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.score{font-family:var(--font-display);font-weight:800;font-size:clamp(3rem,9vw,4.6rem);line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.score small{font-size:.4em;color:var(--muted)}
.result-top h2{font-size:1.5rem}
.result-top p{color:var(--muted);margin-top:6px}
.section{margin-top:30px}
.section > h2{font-size:1.35rem;margin-bottom:12px}
.review{display:grid;gap:10px}
.review details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0}
.review summary{cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-weight:700}
.review summary .dot{width:26px;height:26px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;color:var(--surface)}
.review .dot.ok{background:var(--ok)} .review .dot.bad{background:var(--bad)}
.review .body{padding:0 16px 16px 54px;display:grid;gap:10px}
.review .ans{font-size:.95rem}
.review .ans span{font-weight:700}
.plan{display:grid;gap:10px;padding:0;margin:0}
.plan li{list-style:none}
.mastery{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:12px;align-items:center;font-size:.92rem}
.bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.mrow .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.next{margin-top:30px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:18px 20px;border:2px dashed var(--line);border-radius:var(--radius)}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.linkbtn{background:none;border:0;padding:4px;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem}

@keyframes rise{from{transform:translateY(8px);opacity:.01}to{transform:none;opacity:1}}
.anim{animation:rise .35s ease-out both}
@media (prefers-reduced-motion: reduce){.anim{animation:none}.opt,svg .grp{transition:none}}

@media (max-width:760px){
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%}
  .stat{min-width:0;padding:8px 10px}
  .stat small{font-size:.7rem}
  .intro{grid-template-columns:1fr;gap:20px}
  .intro .diagram{order:-1}
  .play{grid-template-columns:1fr}
  .play .diagram{position:static;order:2}
  .qcard{padding:18px}
  .result-top{grid-template-columns:1fr;gap:10px}
  .mrow{grid-template-columns:110px minmax(0,1fr) 52px}
  .review .body{padding:0 16px 16px 16px}
}

.chips.tight{margin-top:0}
.chip.rv{background:var(--tip);color:var(--ink);box-shadow:inset 0 0 0 1px var(--tip-line)}
.chip.sm{font-size:.7rem;padding:2px 8px;vertical-align:middle}
.gapnote{font-size:.92rem;font-weight:700;color:var(--accent)}
.muted{color:var(--muted)}
.plan .gq{display:block;font-weight:700;margin-bottom:4px}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="brand">
      <span class="eyebrow">Level 2 Beauty · Skin structure</span>
      <h1>Skin <span>Deep</span> Daily</h1>
    </div>
    <div class="stats" aria-label="Your progress">
      <div class="stat"><b id="st-streak">0</b><small>day streak</small></div>
      <div class="stat"><b id="st-days">0</b><small>sets done</small></div>
      <div class="stat"><b id="st-acc">–</b><small>all-time score</small></div>
      <div class="stat"><b id="st-gaps">0</b><small>gaps to close</small></div>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer class="foot">
    <span>A new set every weekday at 4:00pm UK time, September to May. Your progress is saved in this browser on this device.</span>
    <span id="reset-zone"><button class="linkbtn" id="reset-btn" type="button">Reset my progress</button></span>
  </footer>
  <div class="sr" aria-live="polite" id="live"></div>
</div>

<script src="questions.js"></script>
<script>
(function(){
"use strict";
const app = document.getElementById('app'), live = document.getElementById('live');
const BANK = window.SKIN_QUESTIONS || [];
const CFG = Object.assign({reviewPerDay:3, sharedPerDay:5, resetHour:16, closedDates:[]}, window.SKIN_CONFIG || {});
if (!BANK.length){
  app.innerHTML = '<section class="qcard"><h2>The questions did not load</h2><p style="margin-top:8px">Make sure the file <b>questions.js</b> is in the same folder as this page, then refresh.</p></section>';
  return;
}

/* ------------------------------------------------------------------
   ACADEMIC YEAR CALENDAR
   A new set opens at 4pm (UK time) every weekday from September to May.
   Friday's set stays open over the weekend. June to August and any
   closedDates in questions.js show a break screen.
------------------------------------------------------------------- */
const TZ = 'Europe/London', DAY = 864e5, PER = CFG.sharedPerDay;
const fmtParts = new Intl.DateTimeFormat('en-GB', {timeZone:TZ, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'});
function london(t){ const p = {}; fmtParts.formatToParts(t).forEach(x => p[x.type] = x.value); return {y:+p.year, m:+p.month, d:+p.day, h:(+p.hour)%24}; }
const dn = (y, m, d) => Date.UTC(y, m-1, d) / DAY;
const utc = n => new Date(n * DAY);
const closed = (CFG.closedDates || []).map(r => [Date.parse(r[0] + 'T00:00:00Z') / DAY, Date.parse((r[1] || r[0]) + 'T00:00:00Z') / DAY]).filter(r => !isNaN(r[0]) && !isNaN(r[1]));
const isClosedDay = n => closed.some(r => n >= r[0] && n <= r[1]);
const weekday = n => utc(n).getUTCDay();
const inTerm = n => { const m = utc(n).getUTCMonth() + 1; return m >= 9 || m <= 5; };
const isSetDay = n => inTerm(n) && weekday(n) !== 0 && weekday(n) !== 6 && !isClosedDay(n);
const yearStart = n => { const d = utc(n); return d.getUTCMonth() + 1 >= 9 ? d.getUTCFullYear() : d.getUTCFullYear() - 1; };

function slotAt(t){
  const p = london(t); let n = dn(p.y, p.m, p.d); if (p.h < CFG.resetHour) n--;
  let open = n; const w = weekday(n); if (w === 6) open = n - 1; else if (w === 0) open = n - 2;
  if (!isSetDay(open)) return {closed:true, reason: inTerm(n) ? 'holiday' : 'summer', key: 'c' + n};
  const Y = yearStart(open); let k = 0;
  for (let d = dn(Y, 9, 1); d < open; d++) if (isSetDay(d)) k++;
  return {closed:false, open, Y, k, serial: (Y - 2020) * 400 + k, weekend: open !== n, key: 's' + open};
}
function nextChange(now){
  const cur = slotAt(now);
  let t = Math.ceil(now.getTime() / 36e5) * 36e5;
  for (let i = 0; i < 24 * 130; i++, t += 36e5){ const s = slotAt(new Date(t)); if (s.key !== cur.key && (s.closed !== cur.closed || !s.closed)) return new Date(t); }
  return new Date(t);
}
function nextOpenAt(now){
  const cur = slotAt(now);
  let t = Math.ceil(now.getTime() / 36e5) * 36e5;
  for (let i = 0; i < 24 * 130; i++, t += 36e5){ const s = slotAt(new Date(t)); if (s.key !== cur.key && !s.closed) return new Date(t); }
  return new Date(t);
}
const fmtWhen = new Intl.DateTimeFormat('en-GB', {timeZone:TZ, weekday:'short', day:'numeric', month:'short'});
const fmtDay = new Intl.DateTimeFormat('en-GB', {timeZone:'UTC', weekday:'short', day:'numeric', month:'short'});

function rng(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function sharedSet(Y, k){
  const sets = Math.floor(BANK.length / PER), cycle = Math.floor(k / sets), pos = k % sets;
  return shuffle(BANK.map((_, i) => i), rng(Y * 131 + cycle * 7919 + 11)).slice(pos * PER, pos * PER + PER);
}
const optionOrder = (serial, qid) => shuffle([0,1,2,3], rng(serial * 1009 + qid * 31 + 7));

/* ------------------------------------------------------------------
   STORAGE AND SPACED REPEATS
   A missed question becomes a "knowledge gap". It comes back in the
   learner's next set, then 3 sets later, then 7 sets later. Three
   correct answers in a row close the gap. A wrong answer starts again.
------------------------------------------------------------------- */
const KEY = 'skinDeepYear.v1';
const GAP_STEPS = [1, 3, 7], CLOSE_AFTER = 3;
let memory = null;
function load(){ try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch(e){} return memory || {}; }
function save(){ memory = state; try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
let state = load(); state.history = state.history || {}; state.gaps = state.gaps || {}; state.closedGaps = state.closedGaps || 0;

function dueReviews(serial, shared){
  return Object.keys(state.gaps).map(Number)
    .filter(id => BANK[id] && state.gaps[id].due <= serial && !shared.includes(id))
    .sort((a, b) => state.gaps[a].due - state.gaps[b].due || state.gaps[a].box - state.gaps[b].box || state.gaps[b].miss - state.gaps[a].miss)
    .slice(0, CFG.reviewPerDay);
}
function recordAnswer(id, right, serial){
  const g = state.gaps[id];
  if (!right){ state.gaps[id] = {box:0, due:serial + GAP_STEPS[0], miss:(g ? g.miss : 0) + 1}; return 'opened'; }
  if (!g) return null;
  g.box++;
  if (g.box >= CLOSE_AFTER){ delete state.gaps[id]; state.closedGaps++; return 'closed'; }
  g.due = serial + GAP_STEPS[g.box]; return 'progress';
}

/* ------------------------------------------------------------------
   RENDERING
------------------------------------------------------------------- */
const LETTERS = ['A','B','C','D'];
const TOPICS = ['Epidermis','Dermis','Subcutaneous','Appendages','Hair & nails','Functions','Skin types','Conditions','Skin health'];
const TOPIC_LAYER = {Epidermis:'epi', Dermis:'derm', Subcutaneous:'sub', Appendages:'app', 'Hair & nails':'app'};
const TOPIC_TEXT = {
  Epidermis:'This question is about the <b>epidermis</b>, the outer layer of the skin.',
  Dermis:'This question is about the <b>dermis</b>, the living layer beneath the epidermis.',
  Subcutaneous:'This question is about the <b>subcutaneous layer</b>, the fatty layer beneath the dermis.',
  Appendages:'This question is about the <b>appendages</b>: hair follicles, sebaceous glands and sweat glands.',
  'Hair & nails':'This question is about <b>hair and nails</b>, which grow from the skin.',
  Functions:'This question is about the <b>functions</b> of the skin, which use every layer.',
  'Skin types':'This question is about <b>skin types</b>, which you assess at the surface during consultation.',
  Conditions:'This question is about <b>skin conditions</b> and contraindications you may see in the salon.',
  'Skin health':'This question is about <b>skin health</b> and the factors that affect it.'
};
let slot, target, nextOpen, view = 'start', qi = 0, answered = false;
function refreshSlot(){ const now = new Date(); slot = slotAt(now); target = nextChange(now); nextOpen = nextOpenAt(now); }
refreshSlot();

function entry(){
  if (slot.closed) return null;
  let e = state.history[slot.serial];
  if (!e){ const shared = sharedSet(slot.Y, slot.k), rv = dueReviews(slot.serial, shared); e = {qs: rv.concat(shared), rv, picks: [], done: false}; }
  return e;
}
function persistEntry(e){ state.history[slot.serial] = e; save(); }

function stats(){
  const keys = Object.keys(state.history).map(Number), done = keys.filter(k => state.history[k].done);
  let c = 0, n = 0; keys.forEach(k => state.history[k].picks.forEach(p => { n++; if (p === 0) c++; }));
  let streak = 0;
  if (!slot.closed){ let k = state.history[slot.serial] && state.history[slot.serial].done ? slot.serial : slot.serial - 1; while (state.history[k] && state.history[k].done){ streak++; k--; } }
  else { let k = Math.max(-1, ...done); while (state.history[k] && state.history[k].done){ streak++; k--; } }
  return {streak, days: done.length, acc: n ? Math.round(c / n * 100) : null, gaps: Object.keys(state.gaps).length};
}
function topicStats(){
  const out = {};
  Object.values(state.history).forEach(e => e.picks.forEach((p, i) => { const q = BANK[e.qs[i]]; if (!q) return; const t = q.t; out[t] = out[t] || {c:0, n:0}; out[t].n++; if (p === 0) out[t].c++; }));
  return out;
}
function renderStats(){
  const s = stats();
  document.getElementById('st-streak').textContent = s.streak;
  document.getElementById('st-days').textContent = s.days;
  document.getElementById('st-acc').textContent = s.acc === null ? '–' : s.acc + '%';
  document.getElementById('st-gaps').textContent = s.gaps;
}
function fmtLeft(ms){
  const t = Math.max(0, Math.floor(ms / 1000)), d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return (d ? d + 'd ' + h + 'h ' + String(m).padStart(2,'0') + 'm' : h + 'h ' + String(m).padStart(2,'0') + 'm ' + String(s).padStart(2,'0') + 's');
}
const clockHTML = () => '<span class="clock"><b data-clock>' + fmtLeft(nextOpen - new Date()) + '</b></span>';
const whenHTML = () => '4:00pm on ' + fmtWhen.format(nextOpen);

  let fat = '';
  for (let r = 0; r < 2; r++) for (let c = 0; c < 9; c++){ const x = 22 + c * 30 + (r ? 15 : 0), y = 190 + r * 20; if (x < 280) fat += '<ellipse cx="'+x+'" cy="'+y+'" rx="13" ry="9" fill="var(--gland)" stroke="var(--ink)" stroke-opacity=".35"/>'; }
  return '<svg viewBox="0 0 342 228" role="img" aria-labelledby="dg-t" id="dg"><title id="dg-t">Cross-section of the skin showing the epidermis, dermis, subcutaneous layer and appendages</title>' +
  '<g class="grp" data-g="sub"><rect x="0" y="172" width="290" height="56" fill="var(--sub)"/>' + fat + '</g>' +
  '<g class="grp" data-g="derm"><path d="M0 46 Q18 60 36 46 T72 46 T108 46 T144 46 T180 46 T216 46 T252 46 T290 46 V172 H0Z" fill="var(--derm)"/>' +
    '<path d="M10 150 C70 140 120 160 180 148 S260 140 290 152" fill="none" stroke="var(--vessel)" stroke-width="3"/>' +
    '<path d="M10 158 C70 150 120 168 180 156 S260 150 290 160" fill="none" stroke="var(--vessel)" stroke-width="2" stroke-dasharray="5 4"/>' +
    '<path d="M54 52 q-6 30 6 50" fill="none" stroke="var(--vessel)" stroke-width="1.5"/>' +

  '<g class="grp" data-g="epi"><path d="M0 18 H290 V46 Q272 32 254 46 T218 46 T182 46 T146 46 T110 46 T74 46 T38 46 T0 46Z" fill="var(--epi)"/>' +
    '<path d="M0 18 H290" stroke="var(--ink)" stroke-opacity=".5" stroke-width="2" stroke-dasharray="10 3"/>' +
    '<path d="M0 26 H290" stroke="var(--ink)" stroke-opacity=".2" stroke-width="1"/></g>' +
  '<g class="grp" data-g="app">' +
    '<path d="M98 0 L104 18" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>' +
    '<path d="M98 26 Q96 90 108 150 Q118 162 128 150 Q130 90 116 26Z" fill="var(--gland)" stroke="var(--ink)" stroke-opacity=".6"/>' +
    '<path d="M106 18 L114 150" stroke="var(--ink)" stroke-width="3"/>' +
    '<circle cx="117" cy="157" r="5" fill="var(--vessel)"/>' +
    '<ellipse cx="136" cy="80" rx="14" ry="10" fill="var(--sub)" stroke="var(--ink)" stroke-opacity=".6"/>' +
    '<path d="M124 104 L150 128" stroke="var(--vessel)" stroke-width="3" stroke-linecap="round"/>' +
    '<path d="M232 18 C236 60 226 100 236 160" fill="none" stroke="var(--ink)" stroke-opacity=".7" stroke-width="2"/>' +
    '<path d="M236 160 c-14 0 -14 12 0 12 c14 0 14 12 0 12 c-14 0 -14 -12 0 -12" fill="none" stroke="var(--ink)" stroke-opacity=".7" stroke-width="2"/></g>' +
  '<text class="lbl" x="296" y="36">Epi-</text><text class="lbl" x="296" y="48">dermis</text>' +
  '<text class="lbl" x="296" y="112">Dermis</text>' +
  '<text class="lbl" x="296" y="196">Sub-</text><text class="lbl" x="296" y="208">cut.</text>' +
  '<text class="lbl small" x="150" y="76">sebaceous gland</text>' +
  '<text class="lbl small" x="152" y="136">arrector pili</text>' +
  '<text class="lbl small" x="244" y="186">sweat gland</text>' +
  '<text class="lbl small" x="8" y="142">blood vessels</text>' +
  '</svg>';
}
function focusDiagram(topic){
  const svg = document.getElementById('dg'); if (!svg) return;
  const layer = TOPIC_LAYER[topic];
  svg.classList.toggle('focus', !!layer);
  svg.querySelectorAll('.grp').forEach(g => g.classList.toggle('on', g.dataset.g === layer));
}

function render(){
  renderStats();
  if (slot.closed){ view = 'closed'; renderClosed(); return; }
  const e = entry();
  if (view === 'closed') view = 'start';
  if (e.done) view = 'results';
  if (view === 'start') renderStart(e);
  else if (view === 'play') renderQuestion(e);
  else renderResults(e);
}

function gapsListHTML(limit){
  const ids = Object.keys(state.gaps).map(Number).filter(id => BANK[id]).sort((a, b) => state.gaps[b].miss - state.gaps[a].miss).slice(0, limit || 999);
  if (!ids.length) return '<p class="muted">You have no knowledge gaps right now. Every question you have missed has been answered correctly three times in a row.</p>';
  return '<ul class="plan">' + ids.map(id => '<li class="tip"><strong>' + BANK[id].t + '</strong><span class="gq">' + BANK[id].q + '</span>' + BANK[id].s + '</li>').join('') + '</ul>';
}
function masteryHTML(){
  const ts = topicStats();
  return '<div class="mastery">' + TOPICS.map(t => {
    const v = ts[t], pct = v ? Math.round(v.c / v.n * 100) : null;
    return '<div class="mrow"><span>' + t + '</span><span class="bar" role="img" aria-label="' + t + ': ' + (pct === null ? 'no questions yet' : pct + ' percent correct') + '"><i style="width:' + (pct || 0) + '%"></i></span><span class="pct">' + (pct === null ? 'not yet' : pct + '%') + '</span></div>';
  }).join('') + '</div>';
}

function renderClosed(){
  const summer = slot.reason === 'summer';
  app.innerHTML = '<section class="intro anim"><div>' +
    '<span class="eyebrow">' + (summer ? 'Summer break' : 'Holiday break') + '</span>' +
    '<h2>' + (summer ? 'See you in September' : 'No new questions during the break') + '</h2>' +
    '<p class="lede">' + (summer ? 'Daily questions run on weekdays from September to the end of May.' : 'Daily questions pause during college holidays.') + ' The next set opens at ' + whenHTML() + ', in ' + clockHTML() + '.</p>' +
    '<p class="lede">Your streak and progress are saved. If you want to keep revising, work through your knowledge gaps below.</p></div>' +
    '<aside class="diagram"><figure>' + diagramSVG() + '<figcaption>Skin cross-section. During the quiz, the layer each question is about lights up.</figcaption></figure></aside></section>' +
    '<section class="section"><h2>Your knowledge gaps</h2>' + gapsListHTML() + '</section>' +
    '<section class="section"><h2>Your topic strengths</h2>' + masteryHTML() + '</section>';
}

function renderStart(e){
  const started = e.picks.length > 0, n = e.qs.length, rv = e.rv.length;
  const topics = [...new Set(e.qs.map(i => BANK[i].t))];
  app.innerHTML = '<section class="intro anim">' +
    '<div><h2>' + (started ? 'Pick up where you left off' : 'Your daily skin check') + '</h2>' +
    '<p class="lede">Test what you know about the structure and functions of the skin. Every answer comes with an explanation, and if you get one wrong you will get advice on exactly what to revise.</p>' +
    '<div class="setmeta"><span><b>Today\'s set:</b> ' + PER + ' class questions' + (rv ? ' plus <b>' + rv + ' review question' + (rv > 1 ? 's' : '') + '</b> you missed before' : '') + '.</span>' +
    '<span>' + (slot.weekend ? 'This is Friday\'s set. It stays open over the weekend. ' : 'This set opened at 4:00pm on ' + fmtDay.format(utc(slot.open)) + '. ') + 'The next set opens at ' + whenHTML() + ', in ' + clockHTML() + '.</span></div>' +
    '<div class="chips" aria-label="Topics in today\'s set">' + topics.map(t => '<span class="chip">' + t + '</span>').join('') + '</div>' +
    '<div class="actions"><button class="btn" id="go" type="button">' + (started ? 'Continue: question ' + (e.picks.length + 1) + ' of ' + n : 'Start today\'s ' + n + ' questions') + '</button></div>' +
    '<div class="how"><span>Questions you get wrong come back in later sets until you get them right three times in a row.</span><span>Tip: you can answer with the keys A to D or 1 to 4.</span></div></div>' +
    '<aside class="diagram"><figure>' + diagramSVG() + '<figcaption>Skin cross-section. During the quiz, the layer each question is about lights up.</figcaption></figure></aside>' +
    '</section>';
  document.getElementById('go').onclick = () => { view = 'play'; qi = e.picks.length; answered = false; persistEntry(e); render(); app.focus(); };
}

function gaugeHTML(e, cur){
  const n = e.qs.length;
  return '<ol class="gauge" style="grid-template-columns:repeat(' + n + ',minmax(0,1fr))" aria-label="Progress">' + e.qs.map((_, i) => {
    const f = n > 1 ? i / (n - 1) : 0, bg = f <= .5 ? 'color-mix(in srgb, var(--derm) ' + Math.round(f * 200) + '%, var(--epi))' : 'color-mix(in srgb, var(--sub) ' + Math.round((f - .5) * 200) + '%, var(--derm))';
    const p = e.picks[i]; let cls = '', sym = String(i + 1), lab = 'Question ' + (i + 1) + (i < e.rv.length ? ' (review)' : '');
    if (p !== undefined){ cls = p === 0 ? 'ok' : 'bad'; sym = p === 0 ? '✓' : '✕'; lab += p === 0 ? ', correct' : ', incorrect'; }
    else if (i === cur){ cls = 'cur'; lab += ', current'; }
    return '<li class="' + cls + '" style="background:' + bg + '"><span aria-hidden="true">' + sym + '</span><span class="sr">' + lab + '</span></li>';
  }).join('') + '</ol>';
}

function renderQuestion(e){
  const qid = e.qs[qi], q = BANK[qid], order = optionOrder(slot.serial, qid), isRv = qi < e.rv.length;
  const g = state.gaps[qid];
  app.innerHTML = '<div class="qhead"><span>Question <b>' + (qi + 1) + '</b> of ' + e.qs.length + '</span><span>Next set in ' + clockHTML() + '</span></div>' +
    gaugeHTML(e, qi) +
    '<section class="play">' +
      '<div class="qcard anim" id="qcard"><div class="chips tight"><span class="chip">' + q.t + '</span>' + (isRv ? '<span class="chip rv">Review: you missed this before' + (g && g.box ? ' (' + g.box + ' of ' + CLOSE_AFTER + ' correct)' : '') + '</span>' : '') + '</div>' +
      '<h2 class="qtext" id="qtext">' + q.q + '</h2>' +
      '<div class="opts" role="group" aria-labelledby="qtext">' + order.map((o, k) =>
        '<button class="opt" type="button" id="opt-' + k + '" data-o="' + o + '"><span class="key" aria-hidden="true">' + LETTERS[k] + '</span><span>' + q.o[o] + '</span><span class="mark"></span></button>').join('') +
      '</div><div id="fb"></div><p class="hint-keys" id="hint">Press A to D, or 1 to 4, to choose.</p></div>' +
      '<aside class="diagram"><figure>' + diagramSVG() + '<figcaption>' + (TOPIC_TEXT[q.t] || '') + '</figcaption></figure></aside>' +
    '</section>';
  focusDiagram(q.t);
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(e, +b.dataset.o));
}

function choose(e, o){
  if (answered) return; answered = true;
  const qid = e.qs[qi], q = BANK[qid], right = o === 0;
  e.picks[qi] = o;
  const gap = recordAnswer(qid, right, slot.serial);
  persistEntry(e);
  app.querySelectorAll('.opt').forEach(b => {
    const v = +b.dataset.o; b.disabled = true;
    if (v === 0){ b.classList.add('correct'); b.querySelector('.mark').textContent = right ? 'Your answer ✓' : 'Correct answer'; }
    else if (v === o){ b.classList.add('wrong'); b.querySelector('.mark').textContent = 'Your answer'; }
    else b.classList.add('dim');
  });
  let gapNote = '';
  if (gap === 'opened') gapNote = '<p class="gapnote">This is now one of your knowledge gaps. It will come back in your next set.</p>';
  else if (gap === 'progress') gapNote = '<p class="gapnote">Knowledge gap: ' + state.gaps[qid].box + ' of ' + CLOSE_AFTER + ' correct in a row. It will come back in ' + GAP_STEPS[state.gaps[qid].box] + ' sets\' time.</p>';
  else if (gap === 'closed') gapNote = '<p class="gapnote">Knowledge gap closed. You have answered this correctly three times in a row.</p>';
  const last = qi === e.qs.length - 1;
  document.getElementById('fb').innerHTML = '<div class="feedback anim ' + (right ? 'ok' : 'bad') + '">' +
    '<h3 tabindex="-1" id="fb-h">' + (right ? 'Correct!' : 'Not quite. The answer is: ' + q.o[0]) + '</h3>' +
    '<p>' + q.e + '</p>' +
    (right ? '' : '<div class="tip"><strong>Further study</strong>' + q.s + '</div>') + gapNote +
    '<div><button class="btn" id="next" type="button">' + (last ? 'See my results' : 'Next question') + '</button></div></div>';
  document.getElementById('hint').hidden = true;
  const gw = app.querySelector('.gauge'); if (gw) gw.outerHTML = gaugeHTML(e, qi);
  live.textContent = right ? 'Correct.' : 'Incorrect. The correct answer is ' + q.o[0] + '.';
  document.getElementById('fb-h').focus({preventScroll:true});
  document.getElementById('fb').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'nearest'});
  renderStats();
  document.getElementById('next').onclick = () => {
    if (last){ e.done = true; persistEntry(e); view = 'results'; }
    else { qi++; answered = false; }
    render(); app.focus();
    if (view === 'results') window.scrollTo(0, 0);
  };
}

function renderResults(e){
  const n = e.qs.length, score = e.picks.filter(p => p === 0).length, pct = score / n;
  const rvN = e.rv.length, rvScore = e.picks.slice(0, rvN).filter(p => p === 0).length;
  const wrong = e.picks.map((p, i) => p === 0 ? null : e.qs[i]).filter(x => x !== null);
  const head = pct === 1 ? 'Brilliant!' : pct >= .6 ? 'Good effort!' : 'Keep going!';
  const msg = pct === 1 ? 'Perfect score. You really know your skin structure.' : pct >= .6 ? 'Solid work. Tidy up the gaps below and you will be flying.' : 'Every expert started here. Work through your study plan below and you will see the difference.';
  app.innerHTML = '<div class="anim">' + gaugeHTML(e, -1) +
    '<section class="result-top"><div class="score">' + score + '<small>/' + n + '</small></div>' +
    '<div><h2>' + head + '</h2><p>' + msg + '</p>' + (rvN ? '<p>Review questions: ' + rvScore + ' of ' + rvN + ' correct.</p>' : '') + '</div></section>' +
    (wrong.length ? '<section class="section"><h2>Your study plan</h2><ul class="plan">' + wrong.map(id =>
      '<li class="tip"><strong>' + BANK[id].t + '</strong>' + BANK[id].s + '</li>').join('') + '</ul></section>' : '') +
    '<section class="section"><h2>Today\'s answers</h2><div class="review">' + e.qs.map((id, i) => {
      const q = BANK[id], p = e.picks[i], ok = p === 0;
      return '<details' + (ok ? '' : ' open') + '><summary><span class="dot ' + (ok ? 'ok' : 'bad') + '" aria-hidden="true">' + (ok ? '✓' : '✕') + '</span><span><span class="sr">' + (ok ? 'Correct: ' : 'Incorrect: ') + '</span>' + (i < rvN ? '<span class="chip rv sm">Review</span> ' : '') + q.q + '</span></summary>' +
        '<div class="body">' + (ok ? '' : '<p class="ans">You answered: <span>' + q.o[p] + '</span></p>') +
        '<p class="ans">Correct answer: <span>' + q.o[0] + '</span></p><p>' + q.e + '</p>' +
        (ok ? '' : '<div class="tip"><strong>Further study</strong>' + q.s + '</div>') + '</div></details>';
    }).join('') + '</div></section>' +
    '<section class="section"><h2>Knowledge gaps</h2><p class="muted">' + Object.keys(state.gaps).length + ' to close, ' + state.closedGaps + ' closed so far. Missed questions come back in your next set, then 3 sets later, then 7 sets later. Three correct answers in a row close the gap.</p></section>' +
    '<section class="section"><h2>Your topic strengths</h2>' + masteryHTML() + '</section>' +
    '<div class="next"><span>Your next set opens at ' + whenHTML() + ' (UK time), in ' + clockHTML() + '</span></div></div>';
}

/* Keyboard shortcuts */
document.addEventListener('keydown', ev => {
  if (view !== 'play' || answered || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ev.key.toUpperCase(); let idx = LETTERS.indexOf(k); if (idx < 0 && /^[1-4]$/.test(k)) idx = +k - 1;
  if (idx >= 0){ const b = document.getElementById('opt-' + idx); if (b){ ev.preventDefault(); b.click(); } }
});

/* Reset progress with an in-page confirm */
const zone = document.getElementById('reset-zone');
function resetIdle(){ zone.innerHTML = '<button class="linkbtn" id="reset-btn" type="button">Reset my progress</button>'; document.getElementById('reset-btn').onclick = resetAsk; }
function resetAsk(){
  zone.innerHTML = '<span class="confirm"><span>Delete your streak, history and knowledge gaps?</span><button class="btn small danger" id="rs-yes" type="button">Yes, reset</button><button class="btn small ghost" id="rs-no" type="button">Cancel</button></span>';
  document.getElementById('rs-yes').onclick = () => { state = {history:{}, gaps:{}, closedGaps:0}; save(); view = 'start'; qi = 0; answered = false; resetIdle(); render(); live.textContent = 'Progress reset.'; };
  document.getElementById('rs-no').onclick = resetIdle;
  document.getElementById('rs-no').focus();
}
resetIdle();

/* Clock tick and automatic roll-over */
setInterval(() => {
  const now = new Date();
  if (now >= target){ refreshSlot(); view = 'start'; qi = 0; answered = false; render(); live.textContent = slot.closed ? 'The quiz is now on a break.' : 'A new set of questions is ready.'; return; }
  const t = fmtLeft(nextOpen - now);
  document.querySelectorAll('[data-clock]').forEach(el => el.textContent = t);
}, 1000);

window.__skinTest = {slotAt, nextChange, nextOpenAt, sharedSet, dueReviews, recordAnswer, get state(){ return state; }};
render();
})();
</script>
