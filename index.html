<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skin Deep Daily</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout: a single focused column, with a skin cross-section that lights up the layer each question is about. */
:root{
  --bg:#fbf6f4; --surface:#ffffff; --ink:#2b1b2a; --muted:#6c5a68; --line:#e8d9d6;
  --accent:#8a2c62; --accent-ink:#ffffff; --accent-soft:#f6e3ee;
  --epi:#f2c6ac; --derm:#e59a9c; --sub:#f6dc8c; --vessel:#b53a4a; --gland:#fff3e6;
  --ok:#1d7a5f; --ok-soft:#e1f3ec; --bad:#b33a2b; --bad-soft:#fbe7e3; --tip:#fff6dc; --tip-line:#e7c35a;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1219; --surface:#271a24; --ink:#f6e9f0; --muted:#c2adbb; --line:#3d2b38;
  --accent:#f08bbd; --accent-ink:#2a0f1f; --accent-soft:#3b2132;
  --epi:#c98f74; --derm:#a95e68; --sub:#b89a4c; --vessel:#ff8a98; --gland:#3a2833;
  --ok:#6fd8b2; --ok-soft:#173329; --bad:#ff9a88; --bad-soft:#3d1e1a; --tip:#33291a; --tip-line:#c9a144;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1219; --surface:#271a24; --ink:#f6e9f0; --muted:#c2adbb; --line:#3d2b38;
  --accent:#f08bbd; --accent-ink:#2a0f1f; --accent-soft:#3b2132;
  --epi:#c98f74; --derm:#a95e68; --sub:#b89a4c; --vessel:#ff8a98; --gland:#3a2833;
  --ok:#6fd8b2; --ok-soft:#173329; --bad:#ff9a88; --bad-soft:#3d1e1a; --tip:#33291a; --tip-line:#c9a144;
  color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Masthead */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:2px solid var(--line);margin-bottom:24px}
.brand{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.brand h1{font-size:clamp(2rem,5vw,3rem);font-weight:800;letter-spacing:-.02em}
.brand h1 span{color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{display:flex;flex-direction:column;align-items:flex-start;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:92px}
.stat b{font-family:var(--font-display);font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat small{font-size:.75rem;color:var(--muted);letter-spacing:.04em}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:999px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;font-size:1rem}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{min-height:40px;padding:8px 16px;font-size:.92rem}
.btn.danger{border-color:var(--bad);background:var(--bad);color:var(--surface)}

/* Start screen */
.intro{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px;align-items:center}
.intro h2{font-size:clamp(1.6rem,3.6vw,2.3rem);font-weight:700}
.intro .lede{color:var(--muted);margin-top:10px;max-width:56ch}
.setmeta{margin-top:18px;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);letter-spacing:.02em}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}
.how{margin-top:26px;font-size:.9rem;color:var(--muted);display:grid;gap:4px}

/* Countdown */
.clock{display:inline-flex;gap:6px;align-items:baseline;font-variant-numeric:tabular-nums}
.clock b{font-family:var(--font-display);font-size:1.1rem}

/* Depth gauge */
.gauge{padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0 18px}
.gauge li{list-style:none;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:var(--ink);opacity:.45;border:2px solid transparent}
.gauge li:nth-child(1){background:var(--epi)}
.gauge li:nth-child(2){background:color-mix(in srgb,var(--epi) 50%,var(--derm))}
.gauge li:nth-child(3){background:var(--derm)}
.gauge li:nth-child(4){background:color-mix(in srgb,var(--derm) 50%,var(--sub))}
.gauge li:nth-child(5){background:var(--sub)}
.gauge li.cur{opacity:1;border-color:var(--ink)}
.gauge li.ok,.gauge li.bad{opacity:1}
.gauge li span{background:var(--surface);border-radius:999px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem}
.gauge li.ok span{color:var(--ok)} .gauge li.bad span{color:var(--bad)}
.gauge-wrap{margin:0}
.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;font-size:.9rem;color:var(--muted)}

/* Question */
.play{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.qtext{font-family:var(--font-display);font-weight:700;font-size:clamp(1.25rem,2.6vw,1.6rem);margin:8px 0 18px}
.opts{display:grid;gap:10px;margin:0;padding:0}
.opt{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;min-height:56px;transition:border-color .15s, transform .15s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateX(2px)}
.opt .key{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;background:var(--accent-soft);color:var(--accent);font-family:var(--font-display)}
.opt .mark{font-weight:700;font-size:.85rem}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .key{background:var(--ok);color:var(--surface)}
.opt.correct .mark{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:var(--surface)}
.opt.wrong .mark{color:var(--bad)}
.opt.dim{opacity:.6}
.feedback{margin-top:18px;border-radius:12px;padding:18px;display:grid;gap:12px}
.feedback.ok{background:var(--ok-soft);border:2px solid var(--ok)}
.feedback.bad{background:var(--bad-soft);border:2px solid var(--bad)}
.feedback h3{font-size:1.25rem}
.feedback.ok h3{color:var(--ok)} .feedback.bad h3{color:var(--bad)}
.tip{background:var(--tip);border-left:5px solid var(--tip-line);border-radius:8px;padding:12px 14px}
.tip strong{display:block;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.hint-keys{font-size:.8rem;color:var(--muted);margin-top:12px}

/* Diagram */
.diagram{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;position:sticky;top:calc(env(safe-area-inset-top, 0px) + 12px)}
.diagram figcaption{font-size:.85rem;color:var(--muted);margin-top:8px}
.diagram figcaption b{color:var(--ink)}
.diagram svg{display:block;width:100%;height:auto}
.diagram figure{margin:0}
svg .grp{transition:opacity .3s}
svg.focus .grp{opacity:.28}
svg.focus .grp.on{opacity:1}
svg .lbl{font-family:var(--font-body);font-size:11px;font-weight:700;fill:var(--ink)}
svg .lbl.small{font-size:9.5px;font-weight:400}

/* Results */
.result-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.score{font-family:var(--font-display);font-weight:800;font-size:clamp(3rem,9vw,4.6rem);line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.score small{font-size:.4em;color:var(--muted)}
.result-top h2{font-size:1.5rem}
.result-top p{color:var(--muted);margin-top:6px}
.section{margin-top:30px}
.section > h2{font-size:1.35rem;margin-bottom:12px}
.review{display:grid;gap:10px}
.review details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0}
.review summary{cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-weight:700}
.review summary .dot{width:26px;height:26px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;color:var(--surface)}
.review .dot.ok{background:var(--ok)} .review .dot.bad{background:var(--bad)}
.review .body{padding:0 16px 16px 54px;display:grid;gap:10px}
.review .ans{font-size:.95rem}
.review .ans span{font-weight:700}
.plan{display:grid;gap:10px;padding:0;margin:0}
.plan li{list-style:none}
.mastery{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:12px;align-items:center;font-size:.92rem}
.bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.mrow .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.next{margin-top:30px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:18px 20px;border:2px dashed var(--line);border-radius:var(--radius)}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.linkbtn{background:none;border:0;padding:4px;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem}

@keyframes rise{from{transform:translateY(8px);opacity:.01}to{transform:none;opacity:1}}
.anim{animation:rise .35s ease-out both}
@media (prefers-reduced-motion: reduce){.anim{animation:none}.opt,svg .grp{transition:none}}

@media (max-width:760px){
  .intro{grid-template-columns:1fr;gap:20px}
  .intro .diagram{order:-1}
  .play{grid-template-columns:1fr}
  .play .diagram{position:static;order:2}
  .qcard{padding:18px}
  .result-top{grid-template-columns:1fr;gap:10px}
  .mrow{grid-template-columns:110px minmax(0,1fr) 52px}
  .review .body{padding:0 16px 16px 16px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="brand">
      <span class="eyebrow">Level 2 Beauty · Skin structure</span>
      <h1>Skin <span>Deep</span> Daily</h1>
    </div>
    <div class="stats" aria-label="Your progress">
      <div class="stat"><b id="st-streak">0</b><small>day streak</small></div>
      <div class="stat"><b id="st-days">0</b><small>sets done</small></div>
      <div class="stat"><b id="st-acc">–</b><small>all-time score</small></div>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer class="foot">
    <span>5 new questions every day at 4:00pm UK time. Your progress is saved in this browser on this device.</span>
    <span id="reset-zone"><button class="linkbtn" id="reset-btn" type="button">Reset my progress</button></span>
  </footer>
  <div class="sr" aria-live="polite" id="live"></div>
</div>

<script>
(function(){
"use strict";

/* ------------------------------------------------------------------
   QUESTION BANK
   Each entry: topic, question, options (the FIRST option is the
   correct answer; options are shuffled on screen), explanation,
   further-study advice shown when the learner gets it wrong.
   Add new questions to the END of the list.
------------------------------------------------------------------- */
const Q = (t, q, o, e, s) => ({t, q, o, e, s});
const BANK = [
// ---- Epidermis ----
Q(`Epidermis`, `What is the outermost layer of the epidermis?`,
 [`Stratum corneum`, `Stratum germinativum`, `Stratum spinosum`, `Stratum granulosum`],
 `The stratum corneum (horny layer) is the surface layer. It is made of flat, dead cells filled with keratin that overlap like roof tiles and are constantly shed.`,
 `Re-learn the five epidermal layers in order. From the surface down, try the memory aid "Come Let's Get Sun Burnt": Corneum, Lucidum, Granulosum, Spinosum, Basale (germinativum). Say it out loud, then write the layers from memory.`),
Q(`Epidermis`, `In which layer of the epidermis do new skin cells divide (mitosis)?`,
 [`Stratum germinativum (basal layer)`, `Stratum corneum`, `Stratum lucidum`, `Stratum granulosum`],
 `The stratum germinativum, also called the basal layer, is the deepest layer of the epidermis. Its cells divide to make new cells that push upwards towards the surface.`,
 `Remember that "germinate" means to start growing, so the germinativum is where new cells are born. Draw the epidermis and add an arrow showing cells moving up from the basal layer to the surface.`),
Q(`Epidermis`, `Which layer of the epidermis is only found in thick skin, such as the palms and the soles of the feet?`,
 [`Stratum lucidum`, `Stratum spinosum`, `Stratum germinativum`, `Papillary layer`],
 `The stratum lucidum ("clear layer") is a thin, see-through layer that only appears in thick skin on the palms and soles, where extra protection is needed.`,
 `Look at the thick-skin versus thin-skin comparison in your anatomy and physiology notes. Lucidum sounds like "lucid", meaning clear. Note that the papillary layer belongs to the dermis, not the epidermis.`),
Q(`Epidermis`, `Which cells produce melanin, the pigment that gives skin its colour?`,
 [`Melanocytes`, `Keratinocytes`, `Fibroblasts`, `Mast cells`],
 `Melanocytes sit in the basal layer of the epidermis. They make melanin and pass it to the surrounding keratinocytes, where it helps shield the cell nucleus from UV light.`,
 `Make a flashcard for each skin cell type with its location and job: melanocyte (melanin, basal layer), keratinocyte (keratin, epidermis), fibroblast (collagen and elastin, dermis), mast cell (histamine, dermis).`),
Q(`Epidermis`, `Roughly how long does it take a new cell to travel from the basal layer to the surface and be shed?`,
 [`About 28 days`, `About 7 days`, `About 3 months`, `About 1 year`],
 `In young adult skin the journey takes around 28 days (about four weeks). This slows down as we get older, which is one reason mature skin can look dull.`,
 `Review the process of keratinisation. Link it to treatments: regular exfoliation helps remove the dead cells at the end of this 28-day cycle, and it is the reason we advise clients on home care between appointments.`),
Q(`Epidermis`, `Which protein makes the cells of the stratum corneum tough and waterproof?`,
 [`Keratin`, `Collagen`, `Elastin`, `Melanin`],
 `Keratin is a tough, fibrous protein. As cells move up through the epidermis they fill with keratin (keratinisation), so the surface layer becomes a hard-wearing, water-resistant barrier.`,
 `Sort these four into two groups: "found in the epidermis" (keratin, melanin) and "found in the dermis" (collagen, elastin). Keratin is also what hair and nails are made of, which can help you remember it.`),
Q(`Epidermis`, `Which epidermal layer is known as the "prickle cell" layer and contains Langerhans cells?`,
 [`Stratum spinosum`, `Stratum granulosum`, `Stratum lucidum`, `Stratum corneum`],
 `The stratum spinosum sits just above the basal layer. Its cells are joined by spiny-looking connections, and it contains Langerhans cells, which help the immune system.`,
 `"Spinosum" sounds like "spiny", which matches its prickly look. Go back over the epidermis layers and write one key fact next to each one.`),
Q(`Epidermis`, `What is happening to cells in the stratum granulosum?`,
 [`They fill with granules and begin to die as keratinisation continues`, `They divide rapidly to make new cells`, `They produce sebum to soften the skin`, `They are absorbed back into the bloodstream`],
 `In the granular layer the cells flatten, fill with granules (which help form keratin) and lose their nucleus. This is the point where the cells begin to die.`,
 `Granulosum sounds like "granules". Trace the life of a skin cell from bottom to top: born (germinativum), prickly (spinosum), grainy and dying (granulosum), clear (lucidum), dead and shed (corneum).`),
Q(`Epidermis`, `What is desquamation?`,
 [`The natural shedding of dead cells from the skin's surface`, `The production of melanin in the basal layer`, `The growth of new blood vessels in the dermis`, `The release of sweat onto the skin`],
 `Desquamation is the constant shedding of dead, keratinised cells from the stratum corneum. Exfoliation in a facial speeds this natural process up.`,
 `Add "desquamation" to your key-terms glossary with your own definition. Then link it to the exfoliation step in a facial: what are we removing and why?`),
Q(`Epidermis`, `Does the epidermis contain blood vessels?`,
 [`No, it gets nutrients from blood vessels in the dermis below`, `Yes, it has a large network of capillaries`, `Only in the stratum corneum`, `Only on the face and neck`],
 `The epidermis has no blood vessels of its own. The basal layer is fed by nutrients and oxygen passing up from capillaries in the dermis. This is why a shallow graze on the surface does not bleed.`,
 `Look at a labelled cross-section of the skin and find where the capillaries are. Notice they stop at the dermal papillae and do not go up into the epidermis.`),
Q(`Epidermis`, `What is the main role of Langerhans cells?`,
 [`They detect harmful substances and help the immune system respond`, `They produce melanin to colour the skin`, `They produce collagen fibres`, `They store fat for energy`],
 `Langerhans cells are part of the skin's immune defence. They pick up foreign substances and bacteria and alert the immune system. They play a part in allergic reactions, which is one reason we carry out skin tests.`,
 `Revise the protective function of the skin. Make a mind map called "How skin protects us" and include Langerhans cells, the acid mantle, melanin and keratin.`),
Q(`Epidermis`, `Which list shows the layers of the epidermis in the correct order, from deepest to the surface?`,
 [`Germinativum, spinosum, granulosum, lucidum, corneum`, `Corneum, lucidum, granulosum, spinosum, germinativum`, `Germinativum, granulosum, spinosum, corneum, lucidum`, `Spinosum, germinativum, lucidum, granulosum, corneum`],
 `From the deepest layer up: germinativum (basal), spinosum, granulosum, lucidum, corneum. The second option is the right list but in the wrong direction, from the surface down.`,
 `Read the question carefully: "deepest to surface" is the opposite way round to "surface to deepest". Practise writing the layers in both directions without looking, and use "Come Let's Get Sun Burnt" read backwards for deepest first.`),

// ---- Dermis ----
Q(`Dermis`, `What are the two layers of the dermis?`,
 [`Papillary layer and reticular layer`, `Stratum corneum and stratum lucidum`, `Eccrine layer and apocrine layer`, `Adipose layer and muscle layer`],
 `The dermis has an upper papillary layer, with small bumps (papillae) that lock into the epidermis, and a deeper, thicker reticular layer made of a dense mesh of collagen and elastin.`,
 `Draw the dermis split into two parts and label them. Papillary = papillae (little bumps). Reticular = "reticulum", meaning a net or mesh of fibres.`),
Q(`Dermis`, `Which protein fibres give the skin its strength?`,
 [`Collagen`, `Elastin`, `Keratin`, `Melanin`],
 `Collagen fibres in the dermis give skin its strength and firmness. Elastin gives it the ability to stretch and spring back. Both are made by fibroblasts.`,
 `Remember the pair: collagen = strength, elastin = elasticity. Then revise how both decline with age and UV exposure, since this links to skin ageing and mature skin.`),
Q(`Dermis`, `Which fibres allow the skin to stretch and then return to its normal shape?`,
 [`Elastin`, `Collagen`, `Keratin`, `Reticulin from the epidermis`],
 `Elastin fibres act like elastic bands in the dermis, letting the skin stretch and recoil. When elastin breaks down, skin starts to sag.`,
 `Elastin sounds like "elastic". Try the pinch test on the back of your hand and think about which fibre lets it spring back. Compare young and mature skin in your notes.`),
Q(`Dermis`, `Which cells in the dermis make collagen and elastin?`,
 [`Fibroblasts`, `Melanocytes`, `Langerhans cells`, `Adipocytes`],
 `Fibroblasts are the main cells of the dermis. They produce collagen and elastin fibres and the gel-like substance that surrounds them.`,
 `Link the name to the job: fibroblasts make fibres. Add fibroblasts to your skin-cells flashcards and include where they are found (dermis).`),
Q(`Dermis`, `During an allergic reaction, which substance do mast cells release?`,
 [`Histamine`, `Melanin`, `Sebum`, `Keratin`],
 `Mast cells in the dermis release histamine when the skin is irritated or reacts to an allergen. Histamine widens blood vessels, which causes redness (erythema), swelling and itching.`,
 `Revise what happens during a skin reaction and why we carry out skin sensitivity tests before treatments such as lash and brow tinting. Write down what a positive reaction looks like.`),
Q(`Dermis`, `What do the dermal papillae contain?`,
 [`Capillary loops and nerve endings that serve the epidermis`, `Sweat that is stored before release`, `Fat cells for insulation`, `Dead, keratinised cells`],
 `The dermal papillae are small finger-like bumps at the top of the dermis. They carry tiny blood capillaries that feed the epidermis and nerve endings that sense touch. They also form our fingerprints.`,
 `Study a labelled diagram of the papillary layer. Look at your own fingertips: the ridges are made by the dermal papillae pushing up into the epidermis.`),
Q(`Dermis`, `What is the reticular layer of the dermis mainly made of?`,
 [`A dense network of collagen and elastin fibres`, `Adipose (fatty) tissue`, `Flat, dead keratinised cells`, `Melanin granules`],
 `The reticular layer is the deeper, thicker part of the dermis. Its dense mesh of collagen and elastin gives skin its strength and stretch, and it holds the hair follicles, glands and larger blood vessels.`,
 `Compare the two dermis layers in a two-column table: what each contains and what each does. Remember that fatty tissue belongs to the subcutaneous layer below.`),
Q(`Dermis`, `Which sensory nerve endings in the dermis detect light touch?`,
 [`Meissner's corpuscles`, `Pacinian corpuscles`, `Sebaceous glands`, `Arrector pili muscles`],
 `Meissner's corpuscles sit near the top of the dermis, in the papillae, and respond to light touch. Pacinian corpuscles sit deeper and respond to pressure and vibration.`,

/* ------------------------------------------------------------------
   DAILY SET LOGIC — new set at 16:00 Europe/London every day
------------------------------------------------------------------- */
const PER_DAY = 5, RESET_HOUR = 16, TZ = 'Europe/London';
const EPOCH = Date.UTC(2025, 0, 1) / 864e5;
const fmtParts = new Intl.DateTimeFormat('en-GB', {timeZone: TZ, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'});
function london(now){ const p = {}; fmtParts.formatToParts(now).forEach(x => p[x.type] = x.value); return {y:+p.year, m:+p.month, d:+p.day, h:(+p.hour)%24, mi:+p.minute, s:+p.second}; }
function gameDay(now){ const p = london(now || new Date()); let n = Date.UTC(p.y, p.m-1, p.d)/864e5 - EPOCH; if (p.h < RESET_HOUR) n -= 1; return n; }
function msToReset(now){ now = now || new Date(); const p = london(now); let rem = RESET_HOUR*3600 - (p.h*3600 + p.mi*60 + p.s); if (rem <= 0) rem += 86400; return rem*1000 - now.getMilliseconds(); }
function dayDate(n){ return new Date((n + EPOCH) * 864e5); }
const fmtDay = new Intl.DateTimeFormat('en-GB', {timeZone:'UTC', weekday:'short', day:'numeric', month:'short'});

function rng(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function setFor(n){
  const sets = Math.floor(BANK.length / PER_DAY);
  const cycle = Math.floor(n / sets), pos = ((n % sets) + sets) % sets;
  const order = shuffle(BANK.map((_, i) => i), rng(cycle * 7919 + 20251));
  return order.slice(pos * PER_DAY, pos * PER_DAY + PER_DAY);
}
function optionOrder(n, qid){ return shuffle([0,1,2,3], rng(n * 1009 + qid * 31 + 7)); }

const KEY = 'skinDeepDaily.v1';
let memory = null;
function load(){ try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch(e){} return memory || {history:{}}; }
function save(){ memory = state; try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
let state = load(); if (!state.history) state.history = {};

------------------------------------------------------------------- */
const app = document.getElementById('app'), live = document.getElementById('live');
const LETTERS = ['A','B','C','D'];
const TOPIC_LAYER = {Epidermis:'epi', Dermis:'derm', Subcutaneous:'sub', Appendages:'app'};
const TOPIC_TEXT = {
  Epidermis:'This question is about the <b>epidermis</b>, the outer layer of the skin.',
  Dermis:'This question is about the <b>dermis</b>, the living layer beneath the epidermis.',
  Subcutaneous:'This question is about the <b>subcutaneous layer</b>, the fatty layer beneath the dermis.',
  Appendages:'This question is about the <b>appendages</b>: hair follicles, sebaceous glands and sweat glands.',
  Functions:'This question is about the <b>functions</b> of the skin, which use every layer.',
  'Skin types':'This question is about <b>skin types</b>, which you assess at the surface during consultation.',

};
let today = gameDay(), view = 'start', qi = 0, answered = false;

function entry(){ let e = state.history[today]; if (!e){ e = {qs:setFor(today), picks:[], done:false}; } return e; }
function persistEntry(e){ state.history[today] = e; save(); }

function stats(){
  const days = Object.keys(state.history).map(Number).filter(d => state.history[d].done);
  let correct = 0, total = 0;
  days.forEach(d => { const e = state.history[d]; e.picks.forEach(p => { total++; if (p === 0) correct++; }); });
  let streak = 0, d = state.history[today] && state.history[today].done ? today : today - 1;
  while (state.history[d] && state.history[d].done){ streak++; d--; }
  return {streak, days: days.length, acc: total ? Math.round(correct / total * 100) : null};
}
function topicStats(){
  const out = {};
  Object.values(state.history).forEach(e => e.picks.forEach((p, i) => { const t = BANK[e.qs[i]] ? BANK[e.qs[i]].t : null; if (!t) return; out[t] = out[t] || {c:0, n:0}; out[t].n++; if (p === 0) out[t].c++; }));
  return out;
}
function renderStats(){
  const s = stats();
  document.getElementById('st-streak').textContent = s.streak;
  document.getElementById('st-days').textContent = s.days;
  document.getElementById('st-acc').textContent = s.acc === null ? '–' : s.acc + '%';
}
function clockHTML(){ return '<span class="clock" aria-live="off"><b data-clock>' + fmtLeft(msToReset()) + '</b></span>'; }
function fmtLeft(ms){ const t = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return h + 'h ' + String(m).padStart(2,'0') + 'm ' + String(s).padStart(2,'0') + 's'; }

function diagramSVG(){
  let fat = '';
  for (let r = 0; r < 2; r++) for (let c = 0; c < 9; c++){ const x = 22 + c * 30 + (r ? 15 : 0), y = 190 + r * 20; if (x < 280) fat += '<ellipse cx="'+x+'" cy="'+y+'" rx="13" ry="9" fill="var(--gland)" stroke="var(--ink)" stroke-opacity=".35"/>'; }
  return '<svg viewBox="0 0 342 228" role="img" aria-labelledby="dg-t" id="dg"><title id="dg-t">Cross-section of the skin showing the epidermis, dermis, subcutaneous layer and appendages</title>' +
  '<g class="grp" data-g="sub"><rect x="0" y="172" width="290" height="56" fill="var(--sub)"/>' + fat + '</g>' +
  '<g class="grp" data-g="derm"><path d="M0 46 Q18 60 36 46 T72 46 T108 46 T144 46 T180 46 T216 46 T252 46 T290 46 V172 H0Z" fill="var(--derm)"/>' +
    '<path d="M10 150 C70 140 120 160 180 148 S260 140 290 152" fill="none" stroke="var(--vessel)" stroke-width="3"/>' +
    '<path d="M10 158 C70 150 120 168 180 156 S260 150 290 160" fill="none" stroke="var(--vessel)" stroke-width="2" stroke-dasharray="5 4"/>' +
    '<path d="M54 52 q-6 30 6 50" fill="none" stroke="var(--vessel)" stroke-width="1.5"/>' +
    '<path d="M190 54 l6 26 l-8 0" fill="none" stroke="var(--ink)" stroke-opacity=".6" stroke-width="1.5"/></g>' +
  '<g class="grp" data-g="epi"><path d="M0 18 H290 V46 Q272 32 254 46 T218 46 T182 46 T146 46 T110 46 T74 46 T38 46 T0 46Z" fill="var(--epi)"/>' +
    '<path d="M0 18 H290" stroke="var(--ink)" stroke-opacity=".5" stroke-width="2" stroke-dasharray="10 3"/>' +
    '<path d="M0 26 H290" stroke="var(--ink)" stroke-opacity=".2" stroke-width="1"/></g>' +
  '<g class="grp" data-g="app">' +
    '<path d="M98 0 L104 18" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>' +
    '<path d="M98 26 Q96 90 108 150 Q118 162 128 150 Q130 90 116 26Z" fill="var(--gland)" stroke="var(--ink)" stroke-opacity=".6"/>' +
    '<path d="M106 18 L114 150" stroke="var(--ink)" stroke-width="3"/>' +
    '<circle cx="117" cy="157" r="5" fill="var(--vessel)"/>' +
    '<ellipse cx="136" cy="80" rx="14" ry="10" fill="var(--sub)" stroke="var(--ink)" stroke-opacity=".6"/>' +
    '<path d="M124 104 L150 128" stroke="var(--vessel)" stroke-width="3" stroke-linecap="round"/>' +
    '<path d="M232 18 C236 60 226 100 236 160" fill="none" stroke="var(--ink)" stroke-opacity=".7" stroke-width="2"/>' +
    '<path d="M236 160 c-14 0 -14 12 0 12 c14 0 14 12 0 12 c-14 0 -14 -12 0 -12" fill="none" stroke="var(--ink)" stroke-opacity=".7" stroke-width="2"/></g>' +
  '<text class="lbl" x="296" y="36">Epi-</text><text class="lbl" x="296" y="48">dermis</text>' +
  '<text class="lbl" x="296" y="112">Dermis</text>' +
  '<text class="lbl" x="296" y="196">Sub-</text><text class="lbl" x="296" y="208">cut.</text>' +
  '<text class="lbl small" x="150" y="76">sebaceous gland</text>' +
  '<text class="lbl small" x="152" y="136">arrector pili</text>' +
  '<text class="lbl small" x="244" y="186">sweat gland</text>' +
  '<text class="lbl small" x="8" y="142">blood vessels</text>' +
  '</svg>';
}
function focusDiagram(topic){
  const svg = document.getElementById('dg'); if (!svg) return;
  const layer = TOPIC_LAYER[topic];
  svg.classList.toggle('focus', !!layer);
  svg.querySelectorAll('.grp').forEach(g => g.classList.toggle('on', g.dataset.g === layer));
}

function render(){
  renderStats();
  const e = entry();
  if (!e.done && e.picks.length >= e.qs.length && e.picks.every(p => p !== undefined && p !== null)){ e.done = true; persistEntry(e); renderStats(); }
  if (e.done) view = 'results';
  if (view === 'start') renderStart(e);
  else if (view === 'play') renderQuestion(e);
  else renderResults(e);
}

function renderStart(e){
  const started = e.picks.length > 0;
  const topics = [...new Set(e.qs.map(i => BANK[i].t))];
  const opened = fmtDay.format(dayDate(today)), closes = fmtDay.format(dayDate(today + 1));
  app.innerHTML = '<section class="intro anim">' +
    '<div><h2>' + (started ? 'Pick up where you left off' : 'Five questions. One layer at a time.') + '</h2>' +
    '<p class="lede">Test what you know about the structure and functions of the skin. Every answer comes with an explanation, and if you get one wrong you will get advice on exactly what to revise.</p>' +
    '<div class="setmeta"><span><b>Today\'s set</b> opened at 4:00pm on ' + opened + '.</span><span>The next set arrives at 4:00pm on ' + closes + ', in ' + clockHTML() + '</span></div>' +
    '<div class="chips" aria-label="Topics in today\'s set">' + topics.map(t => '<span class="chip">' + t + '</span>').join('') + '</div>' +
    '<div class="actions"><button class="btn" id="go" type="button">' + (started ? 'Continue: question ' + (e.picks.length + 1) + ' of 5' : 'Start today\'s 5 questions') + '</button></div>' +
    '<div class="how"><span>Tip: you can answer with the keys A to D or 1 to 4.</span></div></div>' +
    '<aside class="diagram"><figure>' + diagramSVG() + '<figcaption>Skin cross-section. During the quiz, the layer each question is about lights up.</figcaption></figure></aside>' +
    '</section>';
  document.getElementById('go').onclick = () => { view = 'play'; qi = e.picks.length; answered = false; persistEntry(e); render(); app.focus(); };
}

function gaugeHTML(e, cur){
  return '<ol class="gauge" aria-label="Progress">' + e.qs.map((_, i) => {
    const p = e.picks[i]; let cls = '', sym = '', lab = 'Question ' + (i+1);
    if (p !== undefined){ cls = p === 0 ? 'ok' : 'bad'; sym = p === 0 ? '✓' : '✕'; lab += p === 0 ? ', correct' : ', incorrect'; }
    if (i === cur && p === undefined){ cls = 'cur'; sym = String(i+1); lab += ', current'; }
    if (!sym) sym = String(i+1);
    return '<li class="' + cls + '"><span aria-hidden="true">' + sym + '</span><span class="sr">' + lab + '</span></li>';
  }).join('') + '</ol>';
}

function renderQuestion(e){
  const qid = e.qs[qi], q = BANK[qid], order = optionOrder(today, qid);
  app.innerHTML = '<div class="qhead"><span>Question <b>' + (qi+1) + '</b> of 5</span><span>Next set in ' + clockHTML() + '</span></div>' +
    gaugeHTML(e, qi) +
    '<section class="play">' +
      '<div class="qcard anim" id="qcard"><span class="chip">' + q.t + '</span>' +
      '<h2 class="qtext" id="qtext">' + q.q + '</h2>' +
      '<div class="opts" role="group" aria-labelledby="qtext">' + order.map((o, k) =>
        '<button class="opt" type="button" id="opt-' + k + '" data-o="' + o + '"><span class="key" aria-hidden="true">' + LETTERS[k] + '</span><span>' + q.o[o] + '</span><span class="mark"></span></button>').join('') +
      '</div><div id="fb"></div><p class="hint-keys" id="hint">Press A to D, or 1 to 4, to choose.</p></div>' +
      '<aside class="diagram"><figure>' + diagramSVG() + '<figcaption>' + (TOPIC_TEXT[q.t] || '') + '</figcaption></figure></aside>' +
    '</section>';
  focusDiagram(q.t);
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(e, +b.dataset.o));
}

function choose(e, o){
  if (answered) return; answered = true;
  const qid = e.qs[qi], q = BANK[qid], right = o === 0;
  e.picks[qi] = o; persistEntry(e);
  app.querySelectorAll('.opt').forEach(b => {
    const v = +b.dataset.o; b.disabled = true;
    if (v === 0){ b.classList.add('correct'); b.querySelector('.mark').textContent = right ? 'Your answer ✓' : 'Correct answer'; }
    else if (v === o){ b.classList.add('wrong'); b.querySelector('.mark').textContent = 'Your answer'; }
    else b.classList.add('dim');
  });
  const last = qi === PER_DAY - 1;
  if (last){ e.done = true; persistEntry(e); }
  const fb = document.getElementById('fb');
  fb.innerHTML = '<div class="feedback anim ' + (right ? 'ok' : 'bad') + '">' +
    '<h3 tabindex="-1" id="fb-h">' + (right ? 'Correct!' : 'Not quite. The answer is: ' + q.o[0]) + '</h3>' +
    '<p>' + q.e + '</p>' +
    (right ? '' : '<div class="tip"><strong>Further study</strong>' + q.s + '</div>') +
    '<div><button class="btn" id="next" type="button">' + (last ? 'See my results' : 'Next question') + '</button></div></div>';
  document.getElementById('hint').hidden = true;
  const gw = app.querySelector('.gauge'); if (gw) gw.outerHTML = gaugeHTML(e, qi);
  live.textContent = right ? 'Correct.' : 'Incorrect. The correct answer is ' + q.o[0] + '.';
  document.getElementById('fb-h').focus({preventScroll:true});
  document.getElementById('fb').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'nearest'});
  renderStats();
  document.getElementById('next').onclick = () => {
    if (last){ e.done = true; persistEntry(e); view = 'results'; }
    else { qi++; answered = false; }
    render(); app.focus();
    if (view === 'results') window.scrollTo(0, 0);
  };
}

function message(score){
  return ['Every expert started here. Work through your study plan below and you will see the difference tomorrow.',
          'A start. Your study plan below shows exactly what to look at next.',
          'Getting there. Spend ten minutes on your study plan and the rest will click.',
          'Solid work. Tidy up the one or two gaps below and you will be flying.',
          'So close. Check the one you missed and you have this topic nailed.',
          'Perfect score. You really know your skin structure.'][score];
}

function renderResults(e){
  const score = e.picks.filter(p => p === 0).length;
  const wrong = e.picks.map((p, i) => p === 0 ? null : e.qs[i]).filter(x => x !== null);
  const ts = topicStats();
  const topics = ['Epidermis','Dermis','Subcutaneous','Appendages','Functions','Skin types','Conditions'];
  app.innerHTML = '<div class="anim">' + gaugeHTML(e, -1) +
    '<section class="result-top"><div class="score">' + score + '<small>/5</small></div>' +
    '<div><h2>' + (score === 5 ? 'Brilliant!' : score >= 3 ? 'Good effort!' : 'Keep going!') + '</h2><p>' + message(score) + '</p></div></section>' +
    (wrong.length ? '<section class="section"><h2>Your study plan</h2><ul class="plan">' + wrong.map(id =>
      '<li class="tip"><strong>' + BANK[id].t + '</strong>' + BANK[id].s + '</li>').join('') + '</ul></section>' : '') +
    '<section class="section"><h2>Today\'s answers</h2><div class="review">' + e.qs.map((id, i) => {
      const q = BANK[id], p = e.picks[i], ok = p === 0;
      return '<details' + (ok ? '' : ' open') + '><summary><span class="dot ' + (ok ? 'ok' : 'bad') + '" aria-hidden="true">' + (ok ? '✓' : '✕') + '</span><span><span class="sr">' + (ok ? 'Correct: ' : 'Incorrect: ') + '</span>' + q.q + '</span></summary>' +
        '<div class="body">' + (ok ? '' : '<p class="ans">You answered: <span>' + q.o[p] + '</span></p>') +
        '<p class="ans">Correct answer: <span>' + q.o[0] + '</span></p><p>' + q.e + '</p>' +
        (ok ? '' : '<div class="tip"><strong>Further study</strong>' + q.s + '</div>') + '</div></details>';
    }).join('') + '</div></section>' +
    '<section class="section"><h2>Your topic strengths</h2><div class="mastery">' + topics.map(t => {
      const v = ts[t]; const pct = v ? Math.round(v.c / v.n * 100) : null;
      return '<div class="mrow"><span>' + t + '</span><span class="bar" role="img" aria-label="' + t + ': ' + (pct === null ? 'no questions yet' : pct + ' percent correct') + '"><i style="width:' + (pct || 0) + '%"></i></span><span class="pct">' + (pct === null ? 'not yet' : pct + '%') + '</span></div>';
    }).join('') + '</div></section>' +
    '<div class="next"><span>Your next 5 questions arrive at 4:00pm (UK time) in ' + clockHTML() + '</span></div></div>';
}

/* Keyboard shortcuts */
document.addEventListener('keydown', ev => {
  if (view !== 'play' || answered || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ev.key.toUpperCase(); let idx = LETTERS.indexOf(k); if (idx < 0 && /^[1-4]$/.test(k)) idx = +k - 1;
  if (idx >= 0){ const b = document.getElementById('opt-' + idx); if (b){ ev.preventDefault(); b.click(); } }
});

/* Reset progress with an in-page confirm */
const zone = document.getElementById('reset-zone');
function resetIdle(){ zone.innerHTML = '<button class="linkbtn" id="reset-btn" type="button">Reset my progress</button>'; document.getElementById('reset-btn').onclick = resetAsk; }
function resetAsk(){
  zone.innerHTML = '<span class="confirm"><span>Delete your streak and history?</span><button class="btn small danger" id="rs-yes" type="button">Yes, reset</button><button class="btn small ghost" id="rs-no" type="button">Cancel</button></span>';
  document.getElementById('rs-yes').onclick = () => { state = {history:{}}; save(); view = 'start'; qi = 0; answered = false; resetIdle(); render(); live.textContent = 'Progress reset.'; };
  document.getElementById('rs-no').onclick = resetIdle;
  document.getElementById('rs-no').focus();
}
resetIdle();

/* Clock tick and automatic roll-over at 4pm */
setInterval(() => {
  const n = gameDay();
  if (n !== today){ today = n; view = 'start'; qi = 0; answered = false; render(); live.textContent = 'A new set of questions is ready.'; return; }
  const t = fmtLeft(msToReset());
  document.querySelectorAll('[data-clock]').forEach(el => el.textContent = t);
}, 1000);

render();
})();
</script>
</body>
</html>
